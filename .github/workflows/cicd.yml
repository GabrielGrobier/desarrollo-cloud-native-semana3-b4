deploy:
  needs: publish
  runs-on: ubuntu-latest
  environment: aws-demo

  steps:
  - name: Descargar repositorio
    uses: actions/checkout@v4

  - name: Crear directorio y copiar Compose a EC2
    uses: appleboy/scp-action@v0.1.7
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USER }}
      key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      source: docker-compose.aws.yml
      target: ~/cloudnative

  - name: Desplegar microservicios por SSH
    uses: appleboy/ssh-action@v1.0.3
    env:
      DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
      IMAGE_TAG: ${{ github.sha }}
      AWS_REGION: ${{ secrets.AWS_REGION }}
      S3_BUCKET: ${{ secrets.S3_BUCKET }}
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
    with:
      host: ${{ secrets.EC2_HOST }}
      username: ${{ secrets.EC2_USER }}
      key: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
      envs: DOCKERHUB_USER,DOCKERHUB_TOKEN,IMAGE_TAG,AWS_REGION,S3_BUCKET,AWS_ACCESS_KEY_ID,AWS_SECRET_ACCESS_KEY,AWS_SESSION_TOKEN
      command_timeout: 15m
      script: |
        set -eu
        umask 077

        cd ~/cloudnative

        # Comprobar que EFS esta montado
        mountpoint -q /mnt/efs || {
          echo "ERROR: EFS no esta montado"
          exit 1
        }

        test -d /mnt/efs/cloudnative || {
          echo "ERROR: Falta /mnt/efs/cloudnative"
          exit 1
        }

        # Crear archivo de variables
        printf 'DOCKERHUB_USER=%s\nIMAGE_TAG=%s\nAWS_REGION=%s\nS3_BUCKET=%s\nAWS_ACCESS_KEY_ID=%s\nAWS_SECRET_ACCESS_KEY=%s\nAWS_SESSION_TOKEN=%s\n' \
          "$DOCKERHUB_USER" "$IMAGE_TAG" "$AWS_REGION" "$S3_BUCKET" \
          "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" "$AWS_SESSION_TOKEN" > .env.tmp

        chmod 600 .env.tmp
        mv .env.tmp .env

        # Autenticacion Docker Hub
        printf '%s' "$DOCKERHUB_TOKEN" | \
          docker login -u "$DOCKERHUB_USER" \
          --password-stdin >/dev/null

        # Validar configuracion
        docker compose \
          --env-file .env \
          -f docker-compose.aws.yml \
          config --quiet

        # Descargar imagenes
        docker compose \
          --env-file .env \
          -f docker-compose.aws.yml pull

        # Iniciar microservicios
        docker compose \
          --env-file .env \
          -f docker-compose.aws.yml \
          up -d --remove-orphans

        # Verificar contenedores
        docker compose \
          --env-file .env \
          -f docker-compose.aws.yml ps

        # Verificar API
        for attempt in $(seq 1 35); do
          if curl -fsS http://localhost:8080/api/health; then
            echo "Despliegue exitoso"
            exit 0
          fi
          sleep 5
        done

        echo "ERROR: La aplicacion no responde"

        docker compose \
          --env-file .env \
          -f docker-compose.aws.yml \
          logs --tail=60

        exit 1
