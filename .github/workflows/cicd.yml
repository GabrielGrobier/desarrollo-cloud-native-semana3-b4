name: CI-CD Cloud Native Semana 3

on:
  push:
    branches: [ main ]
  workflow_dispatch:


permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar Java 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: '17'
        cache: maven

    - name: Pruebas unitarias y compilacion
      run: mvn -B clean verify

    - name: Guardar artefactos Maven
      uses: actions/upload-artifact@v4
      with:
        name: maven-artifacts
        path: |
          document-service/target/*.jar
          storage-service/target/*.jar
        retention-days: 1
        if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Recuperar artefactos
      uses: actions/download-artifact@v4
      with:
        name: maven-artifacts
        path: .

    - name: Configurar Docker Buildx
      uses: docker/setup-buildx-action@v3

    - name: Autenticarse en Docker Hub
      uses: docker/login-action@v3
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Publicar document-service
      uses: docker/build-push-action@v6
      with:
        context: document-service
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloudnative-documents:${{ github.sha }}

    - name: Publicar storage-service
      uses: docker/build-push-action@v6
      with:
        context: storage-service
        push: true
        tags: ${{ secrets.DOCKERHUB_USERNAME }}/cloudnative-storage:${{ github.sha }}

  deploy:
    needs: publish
    runs-on: ubuntu-latest
    environment: aws-demo

    steps:
    - name: Descargar repositorio
      uses: actions/checkout@v4

    - name: Configurar llave SSH
      env:
        SSH_PRIVATE_KEY: ${{ secrets.EC2_SSH_PRIVATE_KEY }}
        EC2_HOST_KEY: ${{ secrets.EC2_HOST_KEY }}
      run: |
        mkdir -p ~/.ssh
        chmod 700 ~/.ssh

        printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/ec2.pem
        chmod 600 ~/.ssh/ec2.pem

        printf '%s\n' "$EC2_HOST_KEY" > ~/.ssh/known_hosts
        chmod 600 ~/.ssh/known_hosts

    - name: Verificar variables de despliegue
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
      run: |
        [[ "$EC2_HOST" =~ ^[a-zA-Z0-9.-]+$ ]]
        [[ "$EC2_USER" =~ ^[a-z_][a-z0-9_-]*$ ]]
        [[ "$DOCKERHUB_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
        [[ "$S3_BUCKET" =~ ^[a-z0-9.-]+$ ]]
        [[ "$AWS_REGION" =~ ^[a-z]{2}-[a-z]+-[0-9]+$ ]]

    - name: Crear directorio en EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
      run: |
        ssh -i ~/.ssh/ec2.pem \
          -o StrictHostKeyChecking=yes \
          -o ConnectTimeout=20 \
          "${EC2_USER}@${EC2_HOST}" \
          'mkdir -p /opt/cloudnative'

    - name: Copiar Docker Compose a EC2
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
      run: |
        scp -i ~/.ssh/ec2.pem \
          -o StrictHostKeyChecking=yes \
          docker-compose.aws.yml \
          "${EC2_USER}@${EC2_HOST}:/opt/cloudnative/docker-compose.aws.yml"

    - name: Desplegar contenedores por SSH
      env:
        EC2_HOST: ${{ secrets.EC2_HOST }}
        EC2_USER: ${{ secrets.EC2_USER }}
        DOCKERHUB_USER: ${{ secrets.DOCKERHUB_USERNAME }}
        IMAGE_TAG: ${{ github.sha }}
        AWS_REGION: ${{ secrets.AWS_REGION }}
        S3_BUCKET: ${{ secrets.S3_BUCKET }}
      run: |
        ssh -i ~/.ssh/ec2.pem \
          -o StrictHostKeyChecking=yes \
          -o ConnectTimeout=20 \
          "${EC2_USER}@${EC2_HOST}" \
          "DOCKERHUB_USER='$DOCKERHUB_USER' IMAGE_TAG='$IMAGE_TAG' AWS_REGION='$AWS_REGION' S3_BUCKET='$S3_BUCKET' bash -se" <<'REMOTE'
        set -euo pipefail

        cd /opt/cloudnative

        printf 'DOCKERHUB_USER=%s\nIMAGE_TAG=%s\nAWS_REGION=%s\nS3_BUCKET=%s\n' \
          "$DOCKERHUB_USER" \
          "$IMAGE_TAG" \
          "$AWS_REGION" \
          "$S3_BUCKET" > .env

        chmod 600 .env

        docker compose -f docker-compose.aws.yml pull

        docker compose -f docker-compose.aws.yml \
          up -d --remove-orphans

        docker compose -f docker-compose.aws.yml ps

        curl --fail \
          --retry 15 \
          --retry-delay 2 \
          --retry-connrefused \
          http://127.0.0.1:8080/api/health
        REMOTE

    - name: Confirmar despliegue
      run: echo "Despliegue SSH completado correctamente"
